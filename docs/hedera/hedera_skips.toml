[[skip]]
prefix = "tests/berlin/eip2929_gas_cost_increases/test_create.py::test_create_nonce_overflow"
reason = "Run On Hedera: This test can only be run in a 'fill' mode. And we are running tests in execute remote mode to Hedera network. Details: deploy_contract(nonce=2**64-1) can't be realized in execute mode — the contract is deployed via one real CREATE tx, so its on-chain nonce is actually 1, not the requested overflow value. CREATE legitimately succeeds against the real (non-overflowed) nonce, so this isn't a Hedera bug, it's a fill-only test premise."

